<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Admin - Seguir Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://seguirplay.com/favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Cores da Seguir Play */
        .gradient-bg { background: linear-gradient(257.28deg, #952852 0.51%, #781F60 104.36%); }
        .text-seguirlplay-red { color: #FF455B; }
        .bg-seguirlplay-red { background-color: #FF455B; }
        .hover\:bg-seguirlplay-red-dark:hover { background-color: #e5384c; }
        .bg-seguirlplay-orange { background-color: #FF6E04; }
        .hover\:bg-seguirlplay-orange-dark:hover { background-color: #e66303; }
        
        /* Transições e Estilos do Painel */
        .main-content { transition: margin-left 0.3s ease; }
        .sidebar { transition: transform 0.3s ease; }

        /* Estilos do Menu Lateral Melhorados */
        .nav-link {
            transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out, border-color 0.2s ease-in-out;
            color: #4a5568;
            border-left: 3px solid transparent;
        }
        .nav-link.active {
            background-color: #fce7f3;
            color: #781F60;
            font-weight: 500;
            border-left-color: #FF455B;
        }
        .nav-link:not(.active):hover {
            background-color: #f7fafc;
        }

        /* Estilos do FAQ */
        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease-out; }
        .faq-item.active .faq-answer { max-height: 800px; padding-top: 1rem; padding-bottom: 1rem; }
        .faq-item.active .faq-toggle-icon { transform: rotate(180deg); }

        /* Estilos para o Toggle Switch de "Contatado" */
        .toggle-checkbox:checked + .toggle-label .toggle-dot {
            transform: translateX(100%);
            background-color: #FF455B;
        }
        .toggle-checkbox:checked + .toggle-label .toggle-bg {
            background-color: #fce7f3;
        }
        .filter-btn.active {
            background-color: #781F60;
            color: white;
        }
        .filter-select {
            border-color: #d1d5db;
        }
        /* Estilos do Chat ao Vivo */
        .chat-message-sent {
            background-color: #781F60;
            color: white;
        }
        .chat-message-received {
            background-color: #e5e7eb;
            color: #1f2937;
        }
        .conversation-item.active {
            background-color: #fce7f3;
        }
        .notification-badge {
            background-color: #FF455B;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 0.7rem;
            position: absolute;
            top: 5px;
            right: 5px;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <div id="faq-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center">

    <script type="module">

        function showAlert(message) {
            const modal = document.getElementById('confirmation-modal');
            document.getElementById('confirmation-message').textContent = message;
            const confirmBtn = document.getElementById('confirm-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            cancelBtn.classList.add('hidden');
            confirmBtn.textContent = 'OK';
            modal.classList.remove('hidden');
            const okHandler = () => {
                modal.classList.add('hidden');
                cancelBtn.classList.remove('hidden');
                confirmBtn.textContent = 'Confirmar';
                confirmBtn.removeEventListener('click', okHandler);
            };
            confirmBtn.replaceWith(confirmBtn.cloneNode(true)); 
            document.getElementById('confirm-btn').addEventListener('click', okHandler);
        }

        function showConfirmation(message, onConfirm) {
            const modal = document.getElementById('confirmation-modal');
            document.getElementById('confirmation-message').textContent = message;
            modal.classList.remove('hidden');
            const confirmBtn = document.getElementById('confirm-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            cancelBtn.classList.remove('hidden');
            confirmBtn.textContent = 'Confirmar';
            const confirmHandler = () => { onConfirm(); closeHandler(); };
            const closeHandler = () => {
                modal.classList.add('hidden');
                confirmBtn.removeEventListener('click', confirmHandler);
                cancelBtn.removeEventListener('click', closeHandler);
            };
            confirmBtn.replaceWith(confirmBtn.cloneNode(true));
            cancelBtn.replaceWith(cancelBtn.cloneNode(true));
            document.getElementById('confirm-btn').addEventListener('click', confirmHandler);
            document.getElementById('cancel-btn').addEventListener('click', closeHandler);
        }

        }

            if (!currentUser) return;
            isSuperAdmin = currentUser.email === superAdminEmail;
            
            const currentUserAdminData = adminUsers.get(currentUser.email);
            canEditFaq = isSuperAdmin || (currentUserAdminData && currentUserAdminData.faqPermission === 'edit');
            canViewAnalytics = isSuperAdmin || (currentUserAdminData && currentUserAdminData.analyticsPermission === 'view');
            canExportData = isSuperAdmin || (currentUserAdminData && currentUserAdminData.exportPermission === 'view');

            navChat.classList.toggle('hidden', !isSuperAdmin && (!currentUserAdminData || currentUserAdminData.chatPermission !== 'view'));

            const disabledAttribute = !canToggleContacted && leadData.contacted ? 'disabled' : '';
            const labelDisabledClass = !canToggleContacted && leadData.contacted ? 'cursor-not-allowed opacity-60' : 'cursor-pointer';

            card.innerHTML = `
                <div class="flex-grow">

                        ${leadData.isMonetized ? `<p><strong>Monetizado:</strong> ${leadData.isMonetized}</p>` : ''}
                        ${monetizationText !== 'N/A' ? `<p><strong>Tipo:</strong> ${monetizationText}</p>` : ''}
                        ${leadData.objective ? `<p><strong>Objetivo:</strong> ${leadData.objective}</p>` : ''}
                    </div>
                </div>
                <div class="mt-4 pt-4 border-t border-gray-200 space-y-3">
                    <div class="flex items-center justify-between">
                        <label for="contacted-${id}" class="flex items-center text-sm font-medium text-gray-700 ${labelDisabledClass}">
                            <input type="checkbox" id="contacted-${id}" class="toggle-checkbox sr-only" ${leadData.contacted ? 'checked' : ''} ${disabledAttribute}>
                            <div class="toggle-label relative flex items-center">
                                <div class="toggle-bg block bg-gray-200 w-10 h-6 rounded-full transition-colors"></div>
                                <div class="toggle-dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>

            card.querySelector(`#contacted-${id}`).addEventListener('change', async (e) => {

                });

            return card;

        function openNotesModal(id, collectionName) {
            const dataMap = collectionName === 'leads' ? leadsData : directContactsData;
            const lead = dataMap.get(id);
            notesModalTitle.textContent = `Anotações para ${lead.name}`;
            
            const notes = lead.notes || [];
            notesList.innerHTML = notes.length > 0
                ? notes.sort((a,b) => b.timestamp.toDate() - a.timestamp.toDate()).map(note => `
                    <div class="bg-gray-100 p-3 rounded mb-2">
                        <p class="text-sm text-gray-800">${note.text}</p>
                        <p class="text-xs text-gray-500 text-right mt-1">- ${note.author.split('@')[0]} em ${new Date(note.timestamp.toDate()).toLocaleString('pt-BR')}</p>
                    </div>`).join('')
                : '<p class="text-sm text-gray-500">Nenhuma anotação ainda.</p>';
            
            newNoteTextInput.value = '';
            notesModal.classList.remove('hidden');

            saveNoteBtn.onclick = async () => {
                const newNoteText = newNoteTextInput.value.trim();
                if (newNoteText) {
                    const newNote = {
                        text: newNoteText,
                        author: currentUser.email,
                        timestamp: new Date()
                    };
                    await updateDoc(doc(db, collectionName, id), {
                        notes: arrayUnion(newNote)
                    });
                    notesModal.classList.add('hidden');
                }
            };
        }
        closeNotesModalBtn.addEventListener('click', () => notesModal.classList.add('hidden'));

            editingFaqId = null;
            faqModalTitle.textContent = 'Adicionar Nova Pergunta';
            faqForm.reset();
            faqModal.classList.remove('hidden');
        });

        closeFaqModalBtn.addEventListener('click', () => { faqModal.classList.add('hidden'); editingFaqId = null; });

        faqForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!canEditFaq) {
                showAlert('Você não tem permissão para salvar alterações no FAQ.');
                return;
            }
            const question = faqQuestionInput.value.trim();
            const answerText = faqAnswerTextInput.value.trim();
            const videoUrl = faqVideoUrlInput.value.trim();
            if (!question || !answerText) {
                showAlert('Pergunta e Resposta são campos obrigatórios.');
                return;
            }
            let faqData = {
                question, answer: answerText, videoUrl: videoUrl || null,
                editedBy: currentUser.email, updatedAt: serverTimestamp()
            };
            try {
                if (editingFaqId) {
                    await setDoc(doc(db, "faq_internal", editingFaqId), faqData, { merge: true });
                } else {
                    faqData.createdAt = serverTimestamp();
                    faqData.order = Date.now();
                    await setDoc(doc(collection(db, "faq_internal")), faqData);
                }
                faqModal.classList.add('hidden');
                faqForm.reset();
                editingFaqId = null;
            } catch (error) {
                console.error("Erro ao salvar FAQ:", error);
                showAlert("Ocorreu um erro ao salvar a pergunta.");
            }
        });
        
        function createFaqItem(faqDoc, index, totalItems) {
            const id = faqDoc.id;
            const faqData = faqDoc.data();
            const item = document.createElement('div');
            item.className = 'faq-item bg-white rounded-lg shadow-md';
            const videoEmbedUrl = faqData.videoUrl ? convertToEmbedUrl(faqData.videoUrl) : null;
            
            const showUpArrow = index > 0;
            const showDownArrow = index < totalItems - 1;

            let controlsHtml = '';
            if (isSuperAdmin) { // Reordenar é apenas para Super Admin
                controlsHtml += `<div class="flex items-center space-x-2">
                                <button data-index="${index}" class="reorder-faq-btn up-btn ${showUpArrow ? '' : 'invisible'}" title="Mover para cima">
                                    <svg class="w-6 h-6 text-gray-400 hover:text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 11l3-3m0 0l3 3m-3-3v8m0-13a9 9 0 110 18 9 9 0 010-18z"></path></svg>
                                </button>
                                <button data-index="${index}" class="reorder-faq-btn down-btn ${showDownArrow ? '' : 'invisible'}" title="Mover para baixo">
                                    <svg class="w-6 h-6 text-gray-400 hover:text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13l-3 3m0 0l-3-3m3 3V8m0 13a9 9 0 110-18 9 9 0 010 18z"></path></svg>
                                </button>
                            </div>`;
            }
            if (canEditFaq) { // Editar/Excluir para quem tem permissão
                controlsHtml += `<button data-id="${id}" class="edit-faq-btn text-blue-500 hover:text-blue-700 font-medium">Editar</button>
                                 <button data-id="${id}" class="delete-faq-btn text-red-500 hover:text-red-700 font-medium">Excluir</button>`;
            }

            item.innerHTML = `
                <button type="button" class="faq-question-toggle flex justify-between items-center w-full p-5 text-left font-medium text-gray-800 rounded-lg hover:bg-gray-50 transition-colors">
                    <span class="text-seguirlplay-red font-bold">${faqData.question}</span>
                    <svg class="w-5 h-5 flex-shrink-0 transition-transform faq-toggle-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="faq-answer px-5 text-gray-700">
                    <p class="mb-4 whitespace-pre-wrap">${faqData.answer}</p>
                    ${videoEmbedUrl ? `
                        <div class="mb-4">
                            <h4 class="font-semibold mb-2">Vídeo de Apoio:</h4>
                            <div style="position: relative; width: 100%; padding-top: 56.25%;">
                                <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="${videoEmbedUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="rounded-lg"></iframe>
                            </div>
                        </div>` : ''}
                    <div class="pt-4 border-t border-gray-100 flex space-x-4 justify-end items-center">
                        <span class="text-xs text-gray-400 mr-auto">Última edição: ${faqData.updatedAt ? new Date(faqData.updatedAt.toDate()).toLocaleString('pt-BR') : 'N/A'}</span>
                        ${controlsHtml}
                    </div>
                </div>`;
            
            item.querySelector('.faq-question-toggle').addEventListener('click', () => item.classList.toggle('active'));

            if (canEditFaq) {
                if (isSuperAdmin) {
                     item.querySelectorAll('.reorder-faq-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const currentIndex = parseInt(e.currentTarget.dataset.index, 10);
                            const direction = e.currentTarget.classList.contains('up-btn') ? 'up' : 'down';
                            handleFaqReorder(currentIndex, direction);
                        });
                    });
                }
               
                const editBtn = item.querySelector('.edit-faq-btn');
                if(editBtn) editBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editingFaqId = id;
                    faqModalTitle.textContent = 'Editar Pergunta';
                    faqQuestionInput.value = faqData.question;
                    faqAnswerTextInput.value = faqData.answer;
                    faqVideoUrlInput.value = faqData.videoUrl || '';
                    faqModal.classList.remove('hidden');
                });
                
                const deleteBtn = item.querySelector('.delete-faq-btn');
                if(deleteBtn) deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showConfirmation(`Tem certeza que deseja excluir a pergunta: "${faqData.question}"?`, async () => {
                        await deleteDoc(doc(db, "faq_internal", id));
                    });
                });
            }
            return item;
        }

        async function handleFaqReorder(currentIndex, direction) {
            const swapIndex = direction === 'up' ? currentIndex - 1 : currentIndex + 1;
            if (swapIndex < 0 || swapIndex >= faqDocs.length) return;

            const itemA = faqDocs[currentIndex];
            const itemB = faqDocs[swapIndex];
            const orderA = itemA.data().order || (itemA.data().createdAt ? itemA.data().createdAt.toMillis() : 0);
            const orderB = itemB.data().order || (itemB.data().createdAt ? itemB.data().createdAt.toMillis() : 0);
            
            try {
                const batch = writeBatch(db);
                const docRefA = doc(db, "faq_internal", itemA.id);
                batch.update(docRefA, { order: orderB });
                const docRefB = doc(db, "faq_internal", itemB.id);
                batch.update(docRefB, { order: orderA });
                await batch.commit();
            } catch (error) {
                console.error("Erro ao reordenar FAQ:", error);
                showAlert("Não foi possível mudar a ordem da pergunta.");
            }
        }

        function convertToEmbedUrl(url) {
            if (!url) return null;
            let videoId = null;
            try {
                const urlObj = new URL(url);
                if (urlObj.hostname.includes('youtube.com')) {
                    videoId = urlObj.searchParams.get('v');
                } else if (urlObj.hostname.includes('youtu.be')) {
                    videoId = urlObj.pathname.slice(1);
                }
            } catch (e) { return null; }
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
        }
        
        function renderFaqList() {
            faqListContainer.innerHTML = '';
            if (faqDocs.length === 0) {
                faqListContainer.innerHTML = '<p class="text-gray-500">Nenhuma pergunta frequente cadastrada.</p>';
            }
            faqDocs.forEach((doc, index) => {
                faqListContainer.appendChild(createFaqItem(doc, index, faqDocs.length));
            });
        }

        function listenToFaq() {
            if (faqUnsubscribe) faqUnsubscribe();
            const q = query(collection(db, 'faq_internal'));
            faqUnsubscribe = onSnapshot(q, (snapshot) => {
                faqDocs = snapshot.docs.sort((a, b) => {
                    const orderA = a.data().order || (a.data().createdAt ? a.data().createdAt.toMillis() : 0);
                    const orderB = b.data().order || (b.data().createdAt ? b.data().createdAt.toMillis() : 0);
                    return orderA - orderB;
                });
                renderFaqList();
            });
        }
        
        // --- Funções de Exportação ---
        function exportToCsv(dataArray, filename) {
            const headers = ["Nome", "Email", "WhatsApp", "Canal", "Monetizado", "Tipo de Monetização", "Objetivo", "Data", "Contatado", "Contatado Por", "Interesse"];
            const sanitize = (value) => {
                if (value === null || value === undefined) return '';
                let str = String(value);
                if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                    str = `"${str.replace(/"/g, '""')}"`;
                }
                return str;
            };

            const csvRows = [headers.join(',')];
            dataArray.forEach(row => {
                const values = [
                    sanitize(row.name), sanitize(row.email), sanitize(row.phone),
                    sanitize(row.channelLink), sanitize(row.isMonetized),
                    sanitize(getMonetizationTypeText(row.monetizationType)),
                    sanitize(row.objective),
                    sanitize(row.timestamp ? row.timestamp.toDate().toLocaleString('pt-BR') : ''),
                    sanitize(row.contacted ? 'Sim' : 'Não'), sanitize(row.contactedBy), sanitize(row.interest)
                ];
                csvRows.push(values.join(','));
            });

            const csvString = csvRows.join('\n');
            const blob = new Blob([`\uFEFF${csvString}`], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportToPdf(dataArray, title) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });

            doc.setFontSize(18);
            doc.text(title, 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text(`Exportado em: ${new Date().toLocaleString('pt-BR')}`, 14, 30);

            const headers = [["Nome", "Email", "WhatsApp", "Tipo de Monetização", "Data", "Contatado", "Interesse"]];
            const body = dataArray.map(row => [
                row.name || '', row.email || '', row.phone || '',
                getMonetizationTypeText(row.monetizationType) || '',
                row.timestamp ? row.timestamp.toDate().toLocaleDateString('pt-BR') : '',
                row.contacted ? `Sim (${row.contactedBy ? row.contactedBy.split('@')[0] : ''})` : 'Não',
                row.interest || 'Pendente'
            ]);

            doc.autoTable({
                head: headers,
                body: body,
                startY: 35,
                theme: 'striped',
                headStyles: { fillColor: [120, 31, 96] }
            });

            doc.save(`${title.replace(/\s/g, '_')}.pdf`);
        }
        
        exportLeadsCsvBtn.addEventListener('click', () => {
            const dataArray = Array.from(leadsData.values());
            if (dataArray.length > 0) exportToCsv(dataArray, 'leads_chatbot.csv');
            else showAlert('Não há dados para exportar.');
        });
        exportLeadsPdfBtn.addEventListener('click', () => {
            const dataArray = Array.from(leadsData.values());
            if (dataArray.length > 0) exportToPdf(dataArray, 'Leads (Chatbot)');
            else showAlert('Não há dados para exportar.');
        });
        exportDirectCsvBtn.addEventListener('click', () => {
            const dataArray = Array.from(directContactsData.values());
            if (dataArray.length > 0) exportToCsv(dataArray, 'interesse_contato.csv');
            else showAlert('Não há dados para exportar.');
        });
        exportDirectPdfBtn.addEventListener('click', () => {
            const dataArray = Array.from(directContactsData.values());
            if (dataArray.length > 0) exportToPdf(dataArray, 'Interesse em Contato');
            else showAlert('Não há dados para exportar.');
        });

        // --- Funções de Analytics ---
        function updateAnalytics(period) {
            const allLeads = [...leadsData.values()];
            const allDirect = [...directContactsData.values()];
            
            const now = new Date();
            let startDate, endDate = new Date();

            if (typeof period === 'object' && period.type === 'customDay') {
                startDate = new Date(period.year, period.month, period.day);
                endDate = new Date(period.year, period.month, period.day);
            } else {
                switch (period) {
                    case 'today':
                        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                        break;
                    case 'all':
                    default:
                        startDate = null; 
                }
            }

            if (startDate) startDate.setHours(0, 0, 0, 0);
            endDate.setHours(23, 59, 59, 999);

            const filterByDate = (data) => {
                if (!data.timestamp) return false;
                const date = data.timestamp.toDate();
                if (period === 'all') return true;
                return date >= startDate && date <= endDate;
            }

            const filteredLeads = allLeads.filter(filterByDate);
            const filteredDirect = allDirect.filter(filterByDate);
            const filteredData = [...filteredLeads, ...filteredDirect];

            document.getElementById('total-leads').textContent = filteredLeads.length;
            document.getElementById('total-direct').textContent = filteredDirect.length;
            document.getElementById('total-geral').textContent = filteredData.length;
            
            const monetizedCount = filteredData.filter(d => d.isMonetized === 'Sim').length;
            const notMonetizedCount = filteredData.filter(d => d.isMonetized === 'Não').length;
            updateChart(monetizationChart, 'monetization-chart', 'Status de Monetização', ['Monetizado', 'Não Monetizado'], [monetizedCount, notMonetizedCount], 'pie');

            const interestedCount = filteredData.filter(d => d.interest === 'interested').length;
            const notInterestedCount = filteredData.filter(d => d.interest === 'not_interested').length;
            const pendingCount = filteredData.filter(d => d.interest === 'pending' || !d.interest).length;
            updateChart(interestChart, 'interest-chart', 'Status de Interesse', ['Interessado', 'Não Interessado', 'Pendente'], [interestedCount, notInterestedCount, pendingCount], 'doughnut');

            const ALL_MONETIZATION_TYPES = ['Opção 1', 'Opção 2', 'Nenhuma dessas'];
            const monetizationTypes = ALL_MONETIZATION_TYPES.reduce((acc, type) => {
                acc[type] = 0; return acc;
            }, {});

            filteredData.forEach(d => {
                const type = d.monetizationType;
                if (type === 'Opção 1' || type === 'Opção 2' || type === 'Nenhuma dessas') {
                    monetizationTypes[type]++;
                } else if (type) {
                    monetizationTypes['Nenhuma dessas']++;
                }
            });
            
            const monetizationTypeLabels = Object.keys(monetizationTypes);
            const monetizationTypeData = Object.values(monetizationTypes);
            const monetizationTypeTooltipMap = {
                'Opção 1': 'Foco em 1.000 inscritos e 4.000 horas.',
                'Opção 2': 'Foco em 500 inscritos e 3.000 horas.',
                'Nenhuma dessas': 'Outros objetivos ou não especificado.'
            };
            updateChart(monetizationTypeChart, 'monetization-type-chart', 'Tipo de Monetização', monetizationTypeLabels, monetizationTypeData, 'bar', {
                plugins: { tooltip: { callbacks: { afterLabel: (ctx) => monetizationTypeTooltipMap[ctx.label] || '' }}}
            });
            
            const agentCounts = filteredData.reduce((acc, curr) => {
                if (curr.contactedBy) {
                    const agentName = curr.contactedBy.split('@')[0];
                    acc[agentName] = (acc[agentName] || 0) + 1;
                }
                return acc;
            }, {});
            const agentLabels = Object.keys(agentCounts);
            const agentData = Object.values(agentCounts);
            updateChart(agentChart, 'agent-chart', 'Atendimentos por Funcionário', agentLabels, agentData, 'bar');
        }

        function deepMerge(target, source) {
            for (const key in source) {
                if (source[key] instanceof Object && key in target) {
                    Object.assign(source[key], deepMerge(target[key], source[key]));
                }
            }
            Object.assign(target || {}, source);
            return target;
        }

        function updateChart(chartInstance, canvasId, title, labels, data, type, customOptions = {}) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }

            const baseOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: type === 'bar' ? 'none' : 'top' },
                    title: { display: true, text: title, font: { size: 16 } }
                }
            };
            if (type === 'bar') {
                baseOptions.scales = { 
                    y: { beginAtZero: true, ticks: { precision: 0 }, grid: { drawOnChartArea: false } },
                    x: { grid: { display: false } }
                };
            }
            
            const finalOptions = deepMerge(baseOptions, customOptions);

            const chartConfig = {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: data,
                        backgroundColor: type === 'bar' ? '#781F60' : ['#781F60', '#FF455B', '#FF6E04', '#952852', '#FDBA74', '#F0ABFC'],
                        borderColor: '#fff',
                        borderWidth: type === 'bar' ? 0 : 2
                    }]
                },
                options: finalOptions
            };
            
            switch(canvasId) {
                case 'monetization-chart': monetizationChart = new Chart(ctx, chartConfig); break;
                case 'interest-chart': interestChart = new Chart(ctx, chartConfig); break;
                case 'monetization-type-chart': monetizationTypeChart = new Chart(ctx, chartConfig); break;
                case 'agent-chart': agentChart = new Chart(ctx, chartConfig); break;
            }
        }

        function populateDayFilter(year, month) {
            const currentDay = daySelect.value;
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            daySelect.innerHTML = '<option value="all">Mês Inteiro</option>';
            for (let i = 1; i <= daysInMonth; i++) {
                daySelect.innerHTML += `<option value="${i}">${i}</option>`;
            }
            if (daySelect.querySelector(`option[value="${currentDay}"]`)) {
                daySelect.value = currentDay;
            } else {
                daySelect.value = 'all';
            }
        }

        function populateDateFilters() {
            const months = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();

            monthSelect.innerHTML = months.map((month, index) => `<option value="${index}">${month}</option>`).join('');
            
            yearSelect.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const year = currentYear - i;
                yearSelect.innerHTML += `<option value="${year}">${year}</option>`;
            }
            
            populateDayFilter(currentYear, currentMonth);

            yearSelect.value = currentYear;
            monthSelect.value = currentMonth;
            daySelect.value = 'all';
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateAnalytics(btn.dataset.period);
                
                if (btn.dataset.period === 'today' || btn.dataset.period === 'all') {
                    const now = new Date();
                    yearSelect.value = now.getFullYear();
                    monthSelect.value = now.getMonth();
                    populateDayFilter(now.getFullYear(), now.getMonth());
                    daySelect.value = (btn.dataset.period === 'today') ? now.getDate() : 'all';
                }
            });
        });

        function handleDateSelectFilter() {
            filterBtns.forEach(b => b.classList.remove('active'));
            const day = daySelect.value;
            const month = parseInt(monthSelect.value, 10);
            const year = parseInt(yearSelect.value, 10);

            let period;
            if (day === 'all') {
                period = { type: 'customDay', day: 'all', month, year };
            } else {
                period = { type: 'customDay', day: parseInt(day, 10), month, year };
            }
            updateAnalytics(period);
        }

        daySelect.addEventListener('change', handleDateSelectFilter);
        monthSelect.addEventListener('change', () => {
            populateDayFilter(parseInt(yearSelect.value, 10), parseInt(monthSelect.value, 10));
            handleDateSelectFilter();
        });
        yearSelect.addEventListener('change', () => {
            populateDayFilter(parseInt(yearSelect.value, 10), parseInt(monthSelect.value, 10));
            handleDateSelectFilter();
        });

    </script>
